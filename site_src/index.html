<!DOCTYPE html>
<html>
<head>
    <title>Welcome!</title>
    <style>
        .long-tail-q {
            font-family: 'EB Garamond', serif;
            
            /* 1. Use the modern, standard CSS properties first */
            font-variant-alternates: stylistic(ss06);
            font-variant-ligatures: contextual;

            /* 2. Low-level fallback overrides for maximum cross-browser compliance */
            -webkit-font-feature-settings: "ss06" 1, "swsh" 1, "calt" 1;
            font-feature-settings: "ss06" 1, "swsh" 1, "calt" 1;
        }
        body { 
            font-family: "EB Garamond", Garamond, Georgia, serif; 
            padding-top: 20px; 
            background: #6b649e; 
            color: #2a2838; 
        }
        a, a:visited, a:active {
            text-decoration: none;
            color: #f9b957; 
        }
        a:hover {
            color: #ffe1b3; 
        }
        #site-title-container {
            width: 100%;
            align-items: center;
        }
        #site-title { 
            font-size: 200%;
            color: #f9b957; 
            margin-top: 30px;
            text-align: center;
        }
        #site-subtitle-container {
            display: flex;
            justify-content: center;
        }
        #site-subtitle {
            width: 400px;
            font-size: 130%;
            color: #f9b957; 
            margin-top: 10px;
            text-align: center;
        }
        #front_page_image { 
            width: 300px; 
            border: 1px solid #2a2838; 
        }
        #site-frontpage-image-container, #link-to-contents-container {
            margin-top: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        #link-to-contents {
            font-size: 130%;
        }
    </style>
</head>
<body style="border:1px dotted red">
    <div id="site-title-container">
        <div id="site-title">QUEDEE</div>
        <div id="site-subtitle-container">
            <div id="site-subtitle">Quest for Unrelenting Experimentation in the Durability of Electronic Editions</div>
        </div>
    </div>
    <div id="site-frontpage-image-container">
        <img id="front_page_image" src="./images/psalter_flanders_xiii_century_f61r_miniture_of_reynaert_and_cuwaert.png" alt="Folio 61 recto of a 13th century psalter from Flanders. On the right hand bottom of the page there is a minature of the fox Reynaert who is ‘teaching’ Cuwaert to sing the creed. A double entendre: making some sing the creed means making them have an orgasm."/>
    </div>
    <div id="link-to-contents-container">
        <a id="link-to-contents" href="contents.html">Go to contents</a>
    </div>
    <p id="screenSize"></p>
    <p class="long-tail-q">This should just be Queen beautiful.</p>
    <script>
    window.addEventListener('load', function () {
        document.getElementById('screenSize').textContent =
        window.innerWidth + ' x ' + window.innerHeight;
    });
    </script>
    </body>
</html>
